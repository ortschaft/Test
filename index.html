<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Payload</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        h1 { color: #fff; font-size: 1.5rem; margin-top: 0; }
        p { color: #8b949e; font-size: 0.95rem; margin-bottom: 30px; line-height: 1.5; }
        .download-btn {
            display: inline-block;
            background-color: #238636;
            color: #fff;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            transition: background-color 0.2s;
            width: 100%;
            box-sizing: border-box;
        }
        .download-btn:hover { background-color: #2ea043; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Shortcut Payload</h1>
        <p>Klicke auf den Button, um die große Sound-Datei direkt herunterzuladen.</p>
        
        <!-- WICHTIG: Ersetze 'sound.txt' im href genau mit dem Namen deiner hochgeladenen Datei -->
        <a href="Sound.txt" class="download-btn" download>Datei herunterladen</a>
    </div>

</body>
</html>
